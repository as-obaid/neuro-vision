[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neurovision"
version = "0.1.0"
description = "Neuro-Vision: vessel-guided detection and localization of intracranial aneurysms."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Muhammad Obaidullah" }]
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/neurovision"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
